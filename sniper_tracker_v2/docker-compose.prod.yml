# Production-запуск на сервере:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Наружу открыты только 80/443 (Caddy: HTTPS + фронтенд + /api). База, Redis и API доступны
# только внутри docker-сети. Секреты — в .env (шаблон: .env.example).

x-app: &app
  build: .
  restart: unless-stopped
  env_file:
    - ${ENV_FILE:-.env}
  environment:
    # Принудительно: отключает /docs и тестовую оплату независимо от содержимого .env
    ENVIRONMENT: production
    SQL_ECHO: "false"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    # Пароль читается из переменной окружения контейнера, а не подставляется в compose-файл
    command: sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD"'

  web:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    <<: *app
    command: celery -A app.core.celery_app worker --loglevel=info
    depends_on:
      - web

  celery_beat:
    <<: *app
    command: celery -A app.core.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    depends_on:
      - web

  caddy:
    build: ../frontend
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Укажите SITE_ADDRESS (домен сайта) в .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Здесь Caddy хранит HTTPS-сертификаты — не удалять, иначе упрётесь в лимиты Let's Encrypt
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
